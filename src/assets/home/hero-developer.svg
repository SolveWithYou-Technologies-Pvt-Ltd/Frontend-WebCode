<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    
    <!-- Laptop Screen Gradient -->
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Brand Accent Gradient (Teal to Emerald) -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow for 3D Effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-opacity="0.15" />
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#0d9488" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Abstract Background -->
  <rect width="800" height="600" fill="url(#bg-grad)" rx="40" />
  
  <!-- Decorative Floating Circles -->
  <circle cx="150" cy="120" r="80" fill="#99f6e4" opacity="0.4" />
  <circle cx="700" cy="480" r="100" fill="#a7f3d0" opacity="0.3" />
  <circle cx="650" cy="150" r="40" fill="#5eead4" opacity="0.5" />

  <!-- Main Laptop Illustration -->
  <g filter="url(#shadow)">
    <!-- Screen Outer Frame -->
    <rect x="150" y="180" width="500" height="300" rx="16" fill="url(#screen-grad)" />
    
    <!-- Screen Inner Display -->
    <rect x="165" y="195" width="470" height="270" rx="8" fill="#020617" />
    
    <!-- Laptop Base Top -->
    <path d="M 100 480 L 700 480 Q 720 480 725 490 L 75 490 Q 80 480 100 480 Z" fill="#94a3b8" />
    
    <!-- Laptop Base Bottom -->
    <path d="M 75 490 L 725 490 L 725 495 Q 725 500 700 500 L 100 500 Q 75 500 75 495 Z" fill="#64748b" />
    
    <!-- Trackpad -->
    <rect x="350" y="485" width="100" height="8" rx="4" fill="#475569" />
  </g>

  <!-- Code on Screen -->
  <g font-family="monospace" font-size="18" font-weight="bold">
    <!-- Top Bar -->
    <circle cx="190" cy="215" r="5" fill="#ef4444" />
    <circle cx="210" cy="215" r="5" fill="#eab308" />
    <circle cx="230" cy="215" r="5" fill="#22c55e" />
    
    <!-- Code Lines -->
    <text x="190" y="260" fill="#38bdf8">&lt;DigitalServices&gt;</text>
    
    <text x="220" y="300" fill="#cbd5e1">const <tspan fill="#a3e635">project</tspan> = new <tspan fill="#f472b6">App</tspan>();</text>
    
    <text x="220" y="340" fill="#cbd5e1">project.<tspan fill="#60a5fa">scaleBusiness</tspan>({</text>
    <text x="250" y="370" fill="#cbd5e1">quality: <tspan fill="#fbbf24">"Premium"</tspan>,</text>
    <text x="250" y="400" fill="#cbd5e1">speed: <tspan fill="#fbbf24">"Fast"</tspan></text>
    <text x="220" y="430" fill="#cbd5e1">});</text>
    
    <text x="190" y="460" fill="#38bdf8">&lt;/DigitalServices&gt;</text>
  </g>

  <!-- Floating UI Element 1 (Left) -->
  <g filter="url(#shadow)">
    <rect x="60" y="260" width="180" height="110" rx="14" fill="#ffffff" />
    <!-- Icon -->
    <rect x="80" y="280" width="45" height="45" rx="10" fill="url(#accent-grad)" />
    <path d="M 95 302 L 102 309 L 115 296" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Skeleton Text -->
    <rect x="140" y="285" width="80" height="12" rx="6" fill="#e2e8f0" />
    <rect x="140" y="310" width="50" height="10" rx="5" fill="#cbd5e1" />
    <rect x="80" y="340" width="140" height="10" rx="5" fill="#f1f5f9" />
  </g>

  <!-- Floating UI Element 2 (Right) -->
  <g filter="url(#shadow)">
    <rect x="560" y="140" width="200" height="130" rx="14" fill="#ffffff" />
    <!-- Header -->
    <circle cx="590" cy="170" r="16" fill="#14b8a6" />
    <rect x="620" y="162" width="90" height="14" rx="7" fill="#e2e8f0" />
    <!-- Chart / Graphic -->
    <rect x="580" y="200" width="160" height="50" rx="8" fill="#f8fafc" />
    <path d="M 580 240 Q 610 210 630 225 T 680 205 T 740 215" fill="none" stroke="url(#accent-grad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  </g>
</svg>
