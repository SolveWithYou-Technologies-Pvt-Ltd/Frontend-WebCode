<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Blob Gradient -->
    <linearGradient id="blob-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1" /> <!-- teal-100 -->
      <stop offset="100%" stop-color="#d1fae5" /> <!-- emerald-100 -->
    </linearGradient>

    <!-- Server Chassis Gradient -->
    <linearGradient id="server-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" /> <!-- slate-800 -->
      <stop offset="100%" stop-color="#0f172a" /> <!-- slate-950 -->
    </linearGradient>

    <!-- Accent Gradient (Teal to Emerald) -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadow-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
    
    <filter id="shadow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10b981" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Abstract Background Blob -->
  <path d="M 400 100 C 650 100 700 350 700 500 C 700 700 550 750 350 750 C 150 750 100 600 100 400 C 100 200 200 100 400 100 Z" fill="url(#blob-grad)" opacity="0.6" />
  
  <!-- Floating Tech Dots -->
  <circle cx="150" cy="200" r="8" fill="#14b8a6" opacity="0.4" />
  <circle cx="680" cy="250" r="12" fill="#10b981" opacity="0.3" />
  <circle cx="620" cy="680" r="6" fill="#0ea5e9" opacity="0.5" />

  <!-- Main Server Stack -->
  <g filter="url(#shadow-lg)">
    <!-- Base shadow stand -->
    <rect x="220" y="580" width="260" height="20" rx="10" fill="#94a3b8" />
    <rect x="250" y="590" width="200" height="15" rx="7.5" fill="#64748b" />
    
    <!-- Server Chassis -->
    <rect x="180" y="240" width="340" height="340" rx="24" fill="url(#server-grad)" stroke="#334155" stroke-width="4" />
    
    <!-- Server Blade 1 -->
    <rect x="210" y="280" width="280" height="70" rx="12" fill="#334155" />
    <rect x="230" y="305" width="20" height="20" rx="4" fill="#0f172a" />
    <circle cx="270" cy="315" r="5" fill="#10b981" filter="url(#glow-green)" />
    <circle cx="290" cy="315" r="5" fill="#10b981" filter="url(#glow-green)" />
    <rect x="320" y="310" width="140" height="10" rx="5" fill="#475569" />
    
    <!-- Server Blade 2 (Active/Syncing) -->
    <rect x="210" y="375" width="280" height="70" rx="12" fill="#1e293b" stroke="url(#accent-grad)" stroke-width="2" />
    <rect x="230" y="400" width="20" height="20" rx="4" fill="#0f172a" />
    <circle cx="270" cy="410" r="5" fill="#10b981" filter="url(#glow-green)" />
    <circle cx="290" cy="410" r="5" fill="#38bdf8" /> <!-- Syncing light -->
    <rect x="320" y="405" width="90" height="10" rx="5" fill="url(#accent-grad)" />
    <rect x="420" y="405" width="40" height="10" rx="5" fill="#475569" />

    <!-- Server Blade 3 -->
    <rect x="210" y="470" width="280" height="70" rx="12" fill="#334155" />
    <rect x="230" y="495" width="20" height="20" rx="4" fill="#0f172a" />
    <circle cx="270" cy="505" r="5" fill="#10b981" filter="url(#glow-green)" />
    <circle cx="290" cy="505" r="5" fill="#64748b" /> <!-- Idle light -->
    <rect x="320" y="500" width="120" height="10" rx="5" fill="#475569" />
  </g>

  <!-- Floating Configuration Gear (Top Right) -->
  <g transform="translate(560, 260)" filter="url(#shadow-sm)">
    <circle cx="0" cy="0" r="50" fill="#ffffff" />
    <!-- Gear base -->
    <circle cx="0" cy="0" r="28" fill="url(#accent-grad)" />
    <!-- Gear teeth (represented by a dashed thick stroke for a stylized modern look) -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#accent-grad)" stroke-width="12" stroke-dasharray="14 12" />
    <!-- Inner cutout -->
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
  </g>

  <!-- Performance/Uptime Card (Bottom Right) -->
  <g transform="translate(480, 480)" filter="url(#shadow-lg)">
    <rect x="0" y="0" width="240" height="160" rx="20" fill="#ffffff" />
    
    <!-- Card Header -->
    <rect x="20" y="20" width="40" height="40" rx="10" fill="#ecfdf5" />
    <!-- Activity Pulse Line -->
    <path d="M 28 40 L 35 40 L 40 30 L 45 50 L 50 40 L 55 40" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Title -->
    <rect x="75" y="25" width="100" height="12" rx="6" fill="#94a3b8" />
    <rect x="75" y="45" width="60" height="8" rx="4" fill="#cbd5e1" />

    <!-- Performance Bars -->
    <rect x="20" y="85" width="200" height="8" rx="4" fill="#f1f5f9" />
    <rect x="20" y="85" width="180" height="8" rx="4" fill="url(#accent-grad)" />

    <rect x="20" y="110" width="200" height="8" rx="4" fill="#f1f5f9" />
    <rect x="20" y="110" width="160" height="8" rx="4" fill="#14b8a6" />

    <rect x="20" y="135" width="200" height="8" rx="4" fill="#f1f5f9" />
    <rect x="20" y="135" width="190" height="8" rx="4" fill="#10b981" />
  </g>

  <!-- Floating Shield / Security Update (Top Left) -->
  <g transform="translate(100, 160)" filter="url(#shadow-sm)">
    <rect x="0" y="0" width="120" height="120" rx="20" fill="#ffffff" />
    <!-- Shield Icon -->
    <path d="M 60 25 L 30 40 L 30 70 C 30 90 45 105 60 115 C 75 105 90 90 90 70 L 90 40 Z" fill="#ecfdf5" stroke="url(#accent-grad)" stroke-width="4" stroke-linejoin="round" />
    <!-- Checkmark inside Shield -->
    <path d="M 45 70 L 55 80 L 75 55" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Connecting Data Lines (Background logic) -->
  <path d="M 350 240 L 350 180 L 460 180" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" opacity="0.5" />
  <circle cx="460" cy="180" r="4" fill="#14b8a6" />
</svg>
