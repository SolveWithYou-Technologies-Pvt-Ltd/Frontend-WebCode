  <path d="M 180 200 L 180 240 M 220 200 L 220 240" fill="none" stroke="#0d9488" stroke-width="3" stroke-dasharray="4 4" />
  
  <g>
    <path d="M 175 220 L 180 210 L 185 220" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 215 230 L 220 240 L 225 230" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
