      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadowCloud" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0d9488" flood-opacity="0.2" />
    </filter>
  </defs>

  <circle cx="200" cy="200" r="160" fill="#ccfbf1" opacity="0.5" />
  <rect x="100" y="220" width="200" height="120" rx="60" fill="#d1fae5" opacity="0.4" />

  <g transform="translate(130, 240)">
    <path d="M 0 30 C 0 10 140 10 140 30 L 140 50 C 140 70 0 70 0 50 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <circle cx="25" cy="40" r="4" fill="#10b981" />
    <rect x="40" y="38" width="40" height="4" rx="2" fill="#cbd5e1" />
    
    <path d="M 0 60 C 0 40 140 40 140 60 L 140 80 C 140 100 0 100 0 80 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <circle cx="25" cy="70" r="4" fill="#10b981" />
    <rect x="40" y="68" width="60" height="4" rx="2" fill="#cbd5e1" />
  </g>

